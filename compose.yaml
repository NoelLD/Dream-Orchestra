name: dreamorchestra

services:
  frontend:
    build:
      context: .
      dockerfile: src/Frontend/Dockerfile
      target: prod
      args:
        VITE_API_MODE: ${VITE_API_MODE_PROD:-real}
    ports:
      - "127.0.0.1:8080:80"

  frontend-dev:
    profiles: [dev]
    build:
      context: .
      dockerfile: src/Frontend/Dockerfile
      target: dev
    init: true
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_API_MODE: ${VITE_API_MODE:-mock}
      DEV_POLLING: ${DEV_POLLING:-true}
    volumes:
      - ./src/Frontend:/app
      - frontend_node_modules:/app/node_modules

  playwright:
    profiles: [dev]
    image: mcr.microsoft.com/playwright/mcp:v0.0.86
    init: true
    entrypoint: node
    command: ["/app/cli.js", "--headless", "--browser", "chromium", "--no-sandbox", "--port", "8931", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:8931:8931"

  # E2E-Tests und Screenshots: docker compose --profile dev --profile e2e run --rm e2e
  e2e:
    profiles: [e2e]
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    init: true
    ipc: host
    working_dir: /app
    environment:
      E2E_BASE_URL: ${E2E_BASE_URL:-http://frontend-dev:5173}
    volumes:
      - ./src/Frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - frontend-dev
    command: ["npx", "--no-install", "playwright", "test"]

  backend:
    build:
      context: .
      dockerfile: src/Backend/Dockerfile
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    # Dev-Start mit Reload; Polling, weil das Repo im Windows-Dateisystem liegen kann.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "app"]
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      # mock (Standard) | sim | real; überschreibbar: DREAM_API_MODE=sim docker compose up backend
      DREAM_API_MODE: ${DREAM_API_MODE:-mock}
    volumes:
      - ./src/Backend:/app:ro
      - ./src/Backend/data:/app/data
    env_file:
      - path: .env
        required: false

  # MuJoCo YAM scene + Dream-1 control loop + FastAPI (API contract: src/Simulation/README.md, docs at /docs).
  simulation:
    build:
      context: .
      dockerfile: src/Simulation/Dockerfile
    image: dreamorchestra-simulation:local
    init: true
    working_dir: /data
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./src/Simulation:/app:ro
      - ./src/Simulation/data:/data
    env_file:
      - path: .env
        required: false

  # Optional: live MuJoCo window in the browser (noVNC), http://localhost:6080/vnc.html?autoconnect=1&resize=scale
  simulation-gui:
    image: dreamorchestra-simulation:local
    profiles: ["gui"]
    init: true
    working_dir: /data
    environment:
      MUJOCO_GL: glfw
      LIBGL_ALWAYS_SOFTWARE: "1"
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - ./src/Simulation:/app:ro
      - ./src/Simulation/data:/data
    command: ["bash", "/app/tools/gui.sh", "python", "/app/tools/view_pickup.py"]

  database:
    build:
      context: .
      dockerfile: src/Database/Dockerfile
    init: true
    volumes:
      - ./src/Database:/app:ro
      - ./src/Backend/models:/schema:ro
      - ./src/Backend/data:/data

volumes:
  frontend_node_modules:
