name: dreamorchestra

services:
  frontend:
    build:
      context: .
      dockerfile: src/Frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./src/Frontend:/app:ro

  backend:
    build:
      context: .
      dockerfile: src/Backend/Dockerfile
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    # Dev-Start mit Reload; Polling, weil das Repo im Windows-Dateisystem liegen kann.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "app"]
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./src/Backend:/app:ro
      - ./src/Backend/data:/app/data
    env_file:
      - path: .env
        required: false

  simulation:
    build:
      context: .
      dockerfile: src/Simulation/Dockerfile
    init: true
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./src/Simulation:/app:ro

  database:
    build:
      context: .
      dockerfile: src/Database/Dockerfile
    init: true
    volumes:
      - ./src/Database:/app:ro
      - ./src/Backend/models:/schema:ro
      - ./src/Backend/data:/data
